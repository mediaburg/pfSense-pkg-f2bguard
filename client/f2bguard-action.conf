# Install as /etc/fail2ban/action.d/f2bguard.conf after setting the sender
# config path. Fail2Ban passes the jail, IP, and bantime; credentials stay in
# the root-owned sender configuration and TLS key files.
[Definition]
actionstart =
actionstop =
actioncheck =
# Fail2Ban calls actionflush during jail stop/reload.  A successful no-op
# prevents its bulk flush from falling back to one actionunban per ticket;
# the independent authoritative snapshot performs reconciliation.
actionflush = /usr/bin/true
actionban = /usr/bin/python3 /usr/local/lib/f2bguard/client/sender.py --config /usr/local/etc/f2bguard-sender.json enqueue ban --jail <name> --ip <ip> --bantime <bantime>
actionunban = /usr/bin/python3 /usr/local/lib/f2bguard/client/sender.py --config /usr/local/etc/f2bguard-sender.json enqueue unban --jail <name> --ip <ip>

[Init]
name = default
